<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto WhatsApp</title>
    <style>
        /* Estilos para centralizar o botão no ecrã */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Estilo do Botão do WhatsApp */
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        /* Efeito ao passar o rato */
        .btn-whatsapp:hover {
            background-color: #1ebd59;
            transform: scale(1.05);
        }

        /* Ícone SVG básico do WhatsApp */
        .icon {
            width: 24px;
            height: 24px;
            fill: white;
        }
    </style>
</head>
